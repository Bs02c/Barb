# Autenticación (spec 005, research §4). NINGUNA línea "trust".
# Reemplaza el pg_hba.conf de la imagen oficial, que trae "trust" para conexiones locales.
# Revisión spec 005, SEC-003: el superusuario solo entra por socket local (docker exec, peer); por red,
# solo los roles de la app y de operación, solo a la base barberias y solo desde la subred fija de la
# red de Docker (compose.dev.yml: 172.30.54.0/24). El Compose del VPS (fase 7) define su propia subred
# y una línea por servicio.
local all        postgres                                     peer
local all        all                                          scram-sha-256
host  all        postgres                     0.0.0.0/0       reject
host  all        postgres                     ::/0            reject
host  barberias  app_login,auth_login,db_owner,db_backup  172.30.54.0/24  scram-sha-256
