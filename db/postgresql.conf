# PostgreSQL de la plataforma (spec 005, data-model.md §Configuración).
# Sustituye al postgresql.conf de la imagen (se pasa con -c config_file=...).
# shared_buffers se sobrescribe por línea de comandos: 128MB en local, 512MB en el VPS de 4 GB.

listen_addresses = '*'          # la red la limita Docker; la base nunca publica puerto en un servidor
max_connections = 40
shared_buffers = 128MB
effective_cache_size = 2GB
work_mem = 4MB
maintenance_work_mem = 64MB

shared_preload_libraries = 'pg_stat_statements'
password_encryption = scram-sha-256
timezone = 'UTC'
log_timezone = 'UTC'

# No registrar datos personales: ni parámetros ni la sentencia que falló (research §8).
log_error_verbosity = terse
log_parameter_max_length_on_error = 0
log_statement = none
log_min_error_statement = panic
